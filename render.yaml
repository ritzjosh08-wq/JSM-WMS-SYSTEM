# Render Blueprint for the JSM Logistics WMS backend ONLY.
# This replaces Railway as the backend host. The frontend (Netlify) and the database
# (Supabase Postgres) are untouched — this file provisions nothing but the Node/Express API.
#
# To deploy: in the Render dashboard, New -> Blueprint -> point at this repo. Render reads
# this file and creates the service below. After the first deploy, set the secret env vars
# marked "sync: false" in the Render dashboard (Environment tab) — they are intentionally
# NOT stored in this file or in git.
services:
  - type: web
    name: jsm-logistics-backend
    runtime: node
    plan: free             # Render's free web service plan does NOT support persistent disks
                            # (see note below) — bump to "starter" later if you want both
                            # always-on (no cold start) AND persistent dynamic-users.json.
    region: singapore      # pick the region closest to your Supabase project (ap-south-1/ap-southeast-2)
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    # No `disk:` block here — free web services can't attach a persistent disk on Render.
    # Practical effect: `dynamic-users.json` / `customer-permissions.json` (admin-created
    # worker/customer accounts beyond the built-in ones, and any custom permission overrides)
    # live on the free instance's normal filesystem instead, which resets on every redeploy
    # and on the free plan's spin-down/restart cycle. All real inventory/inward/outward/
    # damage/etc. data is in Supabase Postgres and is completely unaffected — only those two
    # JSON-file-backed extras would need re-creating after a restart. Upgrading to the
    # "starter" plan later re-enables a persistent disk (add back the `disk:` block from
    # backend/DEPLOYMENT.md's git history, or ask to have it re-added) if this becomes a
    # real problem.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5001"
      - key: DATABASE_URL
        sync: false   # paste the Supabase SESSION-pooler connection string (see .env.example)
      - key: JWT_SECRET
        sync: false   # generate with: node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      - key: CORS_ORIGIN
        sync: false   # e.g. https://your-staff-frontend.netlify.app,https://your-customer-portal.netlify.app
